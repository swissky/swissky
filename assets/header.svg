<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t">
  <title id="t">Kevin Kyburz. Writer. Builder. Curious by default.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0916"/><stop offset="1" stop-color="#170b28"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cff"/><stop offset=".55" stop-color="#e83ade"/><stop offset="1" stop-color="#ff8a7a"/></linearGradient>
    <radialGradient id="gA"><stop offset="0" stop-color="#622aff" stop-opacity=".6"/><stop offset="1" stop-color="#622aff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB"><stop offset="0" stop-color="#dd04d1" stop-opacity=".45"/><stop offset="1" stop-color="#dd04d1" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".07"/></pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="16"/></clipPath>
    <symbol id="prompt" viewBox="0 0 10 12"><path d="M1 1l6 5-6 5" fill="none" stroke="#e83ade" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="check" viewBox="0 0 12 12"><path d="M1.5 6.5l3 3 6-7" fill="none" stroke="#3ddc84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .da { animation: da 16s ease-in-out infinite; }
      .db { animation: db 20s ease-in-out infinite; }
      .in { opacity: 0; animation: in .5s ease-out forwards; }
      .l1{animation-delay:.2s}.l2{animation-delay:.9s}.l3{animation-delay:1.4s}
      .l4{animation-delay:2.2s}.l5{animation-delay:2.9s}.l6{animation-delay:3.4s}.l7{animation-delay:4.1s}
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes da { 50% { transform: translate(-90px,40px); } }
      @keyframes db { 50% { transform: translate(110px,-30px); } }
      @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .da,.db,.cur { animation: none; } .in { animation: none; opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <circle class="da" cx="980" cy="40" r="300" fill="url(#gA)"/>
    <circle class="db" cx="180" cy="360" r="260" fill="url(#gB)"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <rect y="356" width="1200" height="4" fill="url(#brand)"/>
  </g>

  <g transform="translate(56 0)">
    <text class="mono" y="78" font-size="15" fill="#a996ff" letter-spacing="2">@SWISSKY  /  SINCE 2010</text>
    <text y="146" font-size="64" font-weight="800" fill="#fff" letter-spacing="-2">Kevin Kyburz</text>
    <text y="192" font-size="26" font-weight="600" fill="url(#brand)">Writer. Builder. Curious by default.</text>
    <text y="240" font-size="17" fill="#b7b1c9">Founder of this:matters</text>
    <text y="266" font-size="17" fill="#b7b1c9">Maintainer of EmDash</text>
    <g transform="translate(0 296)">
      <rect width="196" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/>
      <circle cx="20" cy="17" r="5" fill="#3ddc84"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="34" y="22.5" font-size="14" fill="#e6e1f5">Lauerz, Switzerland</text>
    </g>
  </g>

  <g transform="translate(600 40)">
    <rect width="556" height="280" rx="14" fill="#0f0c1c" fill-opacity=".92" stroke="#fff" stroke-opacity=".12"/>
    <path d="M14 0H542A14 14 0 0 1 556 14V36H0V14A14 14 0 0 1 14 0Z" fill="#fff" fill-opacity=".05"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text class="mono" x="278" y="23" text-anchor="middle" font-size="12" fill="#8a84a0">kevin@lauerz: ~</text>
    <g class="mono" font-size="15" fill="#c9c4d9">
      <g class="in l1"><use href="#prompt" x="24" y="61" width="10" height="12"/><text x="44" y="72" fill="#fff">whoami --roles</text></g>
      <g class="in l2"><rect x="24" y="90" width="10" height="10" rx="2" fill="#8b5cff"/><text x="44" y="100">Founder &amp; CEO</text><text x="210" y="100" fill="#fff">this:matters</text></g>
      <g class="in l3"><rect x="24" y="114" width="10" height="10" rx="2" fill="#e83ade"/><text x="44" y="124">Maintainer</text><text x="210" y="124" fill="#fff">emdash-cms/emdash</text></g>
      <g class="in l4"><use href="#prompt" x="24" y="155" width="10" height="12"/><text x="44" y="166" fill="#fff">npm install emdash@latest</text></g>
      <g class="in l5"><use href="#check" x="24" y="184" width="12" height="12"/><text x="44" y="194">Astro on Cloudflare Workers, D1, R2</text></g>
      <g class="in l6"><use href="#check" x="24" y="208" width="12" height="12"/><text x="44" y="218">WordPress import done. Nobody noticed.</text></g>
      <g class="in l7"><use href="#prompt" x="24" y="241" width="10" height="12"/><rect class="cur" x="44" y="238" width="9" height="18" fill="#e83ade"/></g>
    </g>
  </g>
</svg>
